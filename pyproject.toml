[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acp-qq-bridge"
version = "0.1.0"
description = "基于 ACP 协议的 QQ 编程智能体桥接系统"
requires-python = ">=3.11"
dependencies = [
    "nonebot2[fastapi]>=2.1.0",
    "nonebot-adapter-onebot>=2.4.0",
    "websockets>=12.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "structlog>=23.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
acp-qq-bridge = "acp_qq_bridge.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/acp_qq_bridge"]

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
plugins = []
plugin_dirs = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
